<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: MIT
     Ipdoit icon: the Updoit skull holding a studded shield, its point aimed down-left. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a67"/>
      <stop offset="1" stop-color="#18a058"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e8ee"/>
      <stop offset="1" stop-color="#8793a1"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5533b"/>
      <stop offset="1" stop-color="#a8261a"/>
    </linearGradient>
    <radialGradient id="stud" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="0.5" stop-color="#e8b83c"/>
      <stop offset="1" stop-color="#a87412"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- skull (same as Updoit) -->
  <path d="M40 112 a62 60 0 0 1 124 0 q0 26 -16 40 v18 q0 8 -8 8 h-76 q-8 0 -8 -8 v-18 q-16 -14 -16 -40z"
        fill="#f4f1e8"/>
  <ellipse cx="78" cy="114" rx="17" ry="19" fill="#1f2a44"/>
  <ellipse cx="128" cy="114" rx="17" ry="19" fill="#1f2a44"/>
  <circle cx="83" cy="108" r="4" fill="#ffffff"/>
  <circle cx="133" cy="108" r="4" fill="#ffffff"/>
  <path d="M103 132 l-7 13 h14 z" fill="#1f2a44"/>
  <rect x="66" y="156" width="72" height="30" rx="10" fill="#f4f1e8"/>
  <g stroke="#1f2a44" stroke-width="3" stroke-linecap="round">
    <line x1="70" y1="168" x2="134" y2="168"/>
    <line x1="84" y1="160" x2="84" y2="176"/>
    <line x1="98" y1="160" x2="98" y2="176"/>
    <line x1="112" y1="160" x2="112" y2="176"/>
    <line x1="126" y1="160" x2="126" y2="176"/>
  </g>

  <!-- studded shield, drawn point-down, then turned 45deg so the point aims down-left -->
  <g transform="translate(178 146) rotate(45) scale(0.9)">
    <!-- drop shadow -->
    <path d="M0 -50 L44 -40 Q46 16 0 56 Q-46 16 -44 -40 Z" fill="#000000" opacity="0.25"
          transform="translate(3 4)"/>
    <!-- steel rim -->
    <path d="M0 -50 L44 -40 Q46 16 0 56 Q-46 16 -44 -40 Z" fill="url(#steel)"
          stroke="#4b5563" stroke-width="3" stroke-linejoin="round"/>
    <!-- red face -->
    <path d="M0 -38 L33 -31 Q34 12 0 43 Q-34 12 -33 -31 Z" fill="url(#face)"/>
    <!-- cross bands -->
    <path d="M0 -38 V43 M-33 -6 H33" stroke="#7a1a11" stroke-width="5" opacity="0.55"/>
    <!-- studs around the rim -->
    <g fill="url(#stud)" stroke="#7a5408" stroke-width="1">
      <circle cx="0" cy="-44" r="4.2"/>
      <circle cx="22" cy="-39" r="4.2"/>
      <circle cx="-22" cy="-39" r="4.2"/>
      <circle cx="39" cy="-30" r="4.2"/>
      <circle cx="-39" cy="-30" r="4.2"/>
      <circle cx="39" cy="-8" r="4.2"/>
      <circle cx="-39" cy="-8" r="4.2"/>
      <circle cx="34" cy="16" r="4.2"/>
      <circle cx="-34" cy="16" r="4.2"/>
      <circle cx="20" cy="36" r="4.2"/>
      <circle cx="-20" cy="36" r="4.2"/>
      <circle cx="0" cy="49" r="4.2"/>
    </g>
    <!-- central boss -->
    <circle cx="0" cy="-6" r="10" fill="url(#stud)" stroke="#7a5408" stroke-width="1.5"/>
  </g>
</svg>
